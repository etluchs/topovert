[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topovert"
version = "0.1.0"
description = "Convert Swisstopo topographic data into Garmin-installable .IMG map files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marcus Schulte" }]
keywords = ["garmin", "swisstopo", "gis", "mkgmap", "topographic", "dem"]

# Runtime intentionally has ZERO Python dependencies: topovert shells out to the
# GDAL command-line utilities and to mkgmap (Java), and uses only the stdlib
# (urllib, zipfile, subprocess, ...) for everything else. System requirements
# (GDAL CLI, a Java >= 1.8 runtime) are checked at runtime, not pip-installed.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
topovert = "topovert.cli:main"

[project.urls]
Homepage = "https://github.com/marcus/topovert"

[tool.hatch.build.targets.wheel]
packages = ["src/topovert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
